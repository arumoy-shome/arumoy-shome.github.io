name: Publish

on:
  workflow_dispatch:
  push:
    branches: master

permissions:
  contents: write

jobs:
  # A red suite must not reach gh-pages. `needs:` only works between jobs in
  # one workflow, so the suite runs here as well as in test.yml (which covers
  # pull requests). The pandoc setup is duplicated for the same reason.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        env:
          PANDOC_VERSION: "3.7.0.2"
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Set up xmllint
        run: sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Run the test suite
        run: make test

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The apt package lags well behind; the site is built against pandoc 3.x
      # (it relies on --wrap=none and --citeproc), so install a pinned release.
      - name: Set up Pandoc
        env:
          PANDOC_VERSION: "3.7.0.2"
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Build
        run: make

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: arumoy.me
